openapi: 3.0.3
info:
  title: sf API
  description: |
    RESTful API for sf - a kanban-style task management system for software development.
    
    This API provides CRUD operations for projects, tasks, roles, users, workers, and system configuration.
    The system enables task assignment to workers with specific roles, tracking work history, and orchestrating
    software development workflows.
    
    All endpoints require authentication via Basic Auth or session token (obtained via login).
  version: 1.0.0
  contact:
    name: sf Project

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://localhost:8080/api/v1
    description: Local development server (HTTPS)

security:
  - basicAuth: []
  - sessionToken: []

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management (admin only)
  - name: Projects
    description: Project workspace management
  - name: Tasks
    description: Task creation and lifecycle management
  - name: Roles
    description: Role definitions for workers
  - name: Workers
    description: Worker management and task assignment
  - name: Config
    description: System configuration (admin only)
  - name: Orchestrator
    description: Orchestrator heartbeat and status
  - name: Health
    description: Health check and monitoring
  - name: Passkeys
    description: WebAuthn passkey authentication

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using username and password
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token obtained from login endpoint

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
      required:
        - error

    User:
      type: object
      properties:
        id:
          type: string
          description: Unique user identifier
        username:
          type: string
          description: Unique username
        type:
          type: string
          enum: [human, worker, orchestrator]
          description: User type - human (regular user), worker (automated agent), or orchestrator (system process)
        is_active:
          type: boolean
          description: Whether the user is enabled and can authenticate
        created_at:
          type: string
          format: date-time
          description: When the user was created
        updated_at:
          type: string
          format: date-time
          description: When the user was last updated
      required:
        - id
        - username
        - type
        - is_active

    Project:
      type: object
      properties:
        id:
          type: string
          description: Unique project identifier (referred to as project_id in CLI)
        name:
          type: string
          maxLength: 200
          description: Unique project name (single sentence)
        description:
          type: string
          minLength: 10
          description: Multi-paragraph description of project goals
        repository:
          type: string
          maxLength: 500
          nullable: true
          description: Git repository URL for code context
        status:
          type: string
          enum: [active, inactive]
          default: active
          description: Whether orchestrator should process tasks from this project
        visibility:
          type: string
          enum: [public, internal, private]
          default: public
          description: Access control level - public (all can view/contribute), internal (all view, members contribute), private (members only)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: User ID who created the project
        updated_by:
          type: string
          description: User ID who last updated the project
      required:
        - id
        - name
        - description
        - status
        - visibility

    Role:
      type: object
      properties:
        id:
          type: string
          description: Unique role identifier
        name:
          type: string
          maxLength: 100
          description: Short role name (e.g. programmer, tester)
        description:
          type: string
          minLength: 20
          description: Multi-paragraph job description
        goals:
          type: string
          minLength: 50
          description: Instructions and context for LLM workers - becomes the system prompt
        scope:
          type: string
          enum: [system, global, project]
          description: Role visibility - system (built-in), global (user-defined, all projects), project (specific project only)
        project_id:
          type: string
          nullable: true
          description: Required if scope=project, null otherwise
        is_active:
          type: boolean
          default: true
          description: Whether this role can be assigned to workers
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: User ID who created the role
        updated_by:
          type: string
          description: User ID who last updated the role
      required:
        - id
        - name
        - description
        - goals
        - scope
        - is_active

    Task:
      type: object
      properties:
        id:
          type: string
          description: Unique task identifier
        project_id:
          type: string
          description: Project this task belongs to
        title:
          type: string
          maxLength: 200
          description: Single-sentence summary
        type:
          type: string
          enum: [epic, task, bug, spike, chore]
          description: Task classification - epic (large work), task (technical work), bug (defect), spike (research), chore (documentation/non-functional)
        description:
          type: string
          minLength: 10
          description: Multi-paragraph detailed description
        acceptance_criteria:
          type: string
          nullable: true
          description: Multi-paragraph definition of done
        parent_id:
          type: string
          nullable: true
          description: Parent task in hierarchy
        epic_id:
          type: string
          nullable: true
          description: Top-level epic this task belongs to (denormalized for queries)
        depends_on_task_id:
          type: string
          nullable: true
          description: Task that must complete before this one can start
        status:
          type: string
          enum: [idle, active]
          default: idle
          description: Current working status - idle (no worker assigned), active (worker assigned and working)
        worker_id:
          type: string
          nullable: true
          description: Worker currently assigned to this task (null when idle)
        priority:
          type: string
          enum: [low, medium, high, critical]
          default: medium
          description: Urgency level for orchestrator prioritization
        is_complete:
          type: boolean
          default: false
          description: True only when task is totally finished and accepted
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When task was marked complete (only set when is_complete=true)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: User ID who created the task
        updated_by:
          type: string
          description: User ID who last updated the task
        labels:
          type: array
          items:
            type: string
          nullable: true
          description: Tags for categorization and filtering
        estimated_effort:
          type: integer
          nullable: true
          description: Estimated story points or hours
        actual_effort:
          type: integer
          nullable: true
          description: Actual time spent (sum of all work sessions)
        comments:
          type: array
          items:
            $ref: '#/components/schemas/TaskComment'
          nullable: true
          description: Array of comments on this task
        is_deleted:
          type: boolean
          default: false
          description: Soft delete flag
      required:
        - id
        - project_id
        - title
        - type
        - description
        - status
        - priority
        - is_complete

    TaskComment:
      type: object
      properties:
        text:
          type: string
          description: Comment content
        user_id:
          type: string
          description: User who made the comment
        username:
          type: string
          description: Username of commenter
        created_at:
          type: string
          format: date-time
          description: When comment was created
      required:
        - text
        - user_id
        - username
        - created_at

    TaskHistory:
      type: object
      properties:
        id:
          type: string
          description: Unique history entry identifier
        task_id:
          type: string
          description: Task this history belongs to
        started_at:
          type: string
          format: date-time
          description: When work began on this task
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When work ended (null if still in progress)
        state:
          type: string
          enum: [success, failure, abandoned, in-progress]
          description: Outcome of work session - success (completed successfully), failure (attempted but failed), abandoned (stopped without completion), in-progress (currently active)
        worker_id:
          type: string
          description: Worker who performed this work
        role_id:
          type: string
          description: Role the worker was operating under
        notes:
          type: string
          nullable: true
          description: What was done, learned, or why it failed
        created_at:
          type: string
          format: date-time
      required:
        - id
        - task_id
        - started_at
        - state
        - worker_id
        - role_id

    ConfigItem:
      type: object
      properties:
        key:
          type: string
          description: Configuration key
        value:
          type: string
          description: Configuration value
        description:
          type: string
          nullable: true
          description: Human-readable description of this setting
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - key
        - value

    WorkerStats:
      type: object
      properties:
        total_tasks:
          type: integer
          description: Total number of tasks worked on
        completed_tasks:
          type: integer
          description: Number of successfully completed tasks
        failed_tasks:
          type: integer
          description: Number of failed task attempts
        active_tasks:
          type: integer
          description: Number of currently active tasks
        success_rate:
          type: number
          format: float
          description: Percentage of successful completions
      required:
        - total_tasks
        - completed_tasks
        - failed_tasks
        - active_tasks
        - success_rate

    Heartbeat:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
          description: Worker or orchestrator user ID
        status:
          type: string
          description: Current status (IDLE, WORKING, etc)
        task_id:
          type: string
          nullable: true
          description: Current task being worked on (if any)
        last_seen:
          type: string
          format: date-time
          description: Last heartbeat timestamp
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - status
        - last_seen

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Session token for subsequent requests
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8
        email:
          type: string
          format: email
          nullable: true
      required:
        - username
        - password

paths:
  /health:
    get:
      summary: Health check
      description: Check if the server is running and responsive
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      summary: Register new user
      description: |
        Create a new user account. Only available if server config `registration.enabled` is true.
        By default, new users are created as type 'human' with is_active=true.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request (username taken, weak password, etc)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Registration disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login user
      description: |
        Authenticate user and create session. Returns a session token that should be used
        for subsequent authenticated requests. Session token is valid for the duration
        configured in `session.duration` (or permanent if `session.duration` is 0).
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Logout user
      description: Invalidate the current session token
      tags:
        - Authentication
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: logged out

  /auth/me:
    get:
      summary: Get current user
      description: Returns information about the currently authenticated user
      tags:
        - Authentication
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      summary: List all users
      description: List all users in the system (admin only)
      tags:
        - Users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{user_id}:
    get:
      summary: Get user by ID
      description: Get a specific user's information
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{username}/enable:
    post:
      summary: Enable user
      description: Enable a user, allowing them to login and use the system (admin only)
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User enabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{username}/disable:
    post:
      summary: Disable user
      description: Disable a user, preventing login and all API access. Server will return 401 for disabled users. (admin only)
      tags:
        - Users
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{user_id}/reset-password:
    post:
      summary: Reset user password
      description: Reset a user's password (admin only)
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
              required:
                - password
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: password reset successfully
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects:
    get:
      summary: List projects
      description: List all projects the authenticated user can access
      tags:
        - Projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

    post:
      summary: Create project
      description: Create a new project
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  minLength: 10
                repository:
                  type: string
                  maxLength: 500
                  nullable: true
                visibility:
                  type: string
                  enum: [public, internal, private]
                  default: public
                status:
                  type: string
                  enum: [active, inactive]
                  default: active
              required:
                - name
                - description
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}:
    get:
      summary: Get project
      description: Get a specific project by ID
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update project
      description: Update a project's details
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  minLength: 10
                repository:
                  type: string
                  maxLength: 500
                  nullable: true
                visibility:
                  type: string
                  enum: [public, internal, private]
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete project
      description: |
        Delete a project. Will fail if tasks exist (must delete tasks first due to RESTRICT constraint).
      tags:
        - Projects
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Project deleted successfully
        '400':
          description: Cannot delete - project has tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles:
    get:
      summary: List roles
      description: List all roles accessible to the authenticated user
      tags:
        - Roles
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [system, global, project]
          description: Filter by role scope
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by project ID (for project-scoped roles)
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

    post:
      summary: Create role
      description: |
        Create a new role. System roles cannot be created by users (they are built-in).
        Global roles are available across all projects. Project roles are specific to one project.
      tags:
        - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  minLength: 20
                goals:
                  type: string
                  minLength: 50
                scope:
                  type: string
                  enum: [global, project]
                project_id:
                  type: string
                  nullable: true
              required:
                - name
                - description
                - goals
                - scope
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles/{role_id}:
    get:
      summary: Get role
      description: Get a specific role by ID
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update role
      description: |
        Update a role's details. System roles cannot be modified.
        Scope cannot be changed after creation.
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  minLength: 20
                goals:
                  type: string
                  minLength: 50
                is_active:
                  type: boolean
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Invalid request or system role modification attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete role
      description: Delete a role. System roles cannot be deleted.
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role deleted successfully
        '400':
          description: Cannot delete system role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /roles/{role_id}/history:
    get:
      summary: Get role history
      description: Get task history for a specific role - shows all tasks worked on using this role
      tags:
        - Roles
      parameters:
        - name: role_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistory'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks:
    get:
      summary: List tasks
      description: |
        List tasks with optional filters. Does not return full history for each task.
        Use GET /tasks/{task_id}/history for complete task history.
      tags:
        - Tasks
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by project ID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [idle, active]
          description: Filter by task status
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [epic, task, bug, spike, chore]
          description: Filter by task type
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: Filter by worker_id or created_by
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      summary: Create task
      description: Create a new task
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                title:
                  type: string
                  maxLength: 200
                type:
                  type: string
                  enum: [epic, task, bug, spike, chore]
                description:
                  type: string
                  minLength: 10
                acceptance_criteria:
                  type: string
                  nullable: true
                parent_id:
                  type: string
                  nullable: true
                depends_on_task_id:
                  type: string
                  nullable: true
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                  default: medium
              required:
                - project_id
                - title
                - type
                - description
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/request:
    post:
      summary: Request task (worker only)
      description: |
        Worker requests a task to work on. Returns the task currently assigned to this worker.
        If no task is assigned, server may assign one or return empty.
      tags:
        - Tasks
      responses:
        '200':
          description: Task assigned to worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '204':
          description: No task available
        '403':
          description: Forbidden - worker access only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}:
    get:
      summary: Get task
      description: Get a specific task by ID, including full details but not history
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update task
      description: Update a task's details (title, description, status, etc)
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  minLength: 10
                acceptance_criteria:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [idle, active]
                priority:
                  type: string
                  enum: [low, medium, high, critical]
                depends_on_task_id:
                  type: string
                  nullable: true
                labels:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete task
      description: Soft delete a task (sets is_deleted=true)
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/assign:
    post:
      summary: Assign task (admin/orchestrator only)
      description: |
        Assign a task to a specific worker with a specific role.
        When assigned, task status becomes 'active', worker_id is set, and history entry is created.
        Normally done by orchestrator, but admins can manually assign.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id:
                  type: string
                role_id:
                  type: string
              required:
                - worker_id
                - role_id
      responses:
        '200':
          description: Task assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - admin/orchestrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/unassign:
    post:
      summary: Unassign task (admin/orchestrator only)
      description: |
        Remove task from a specific worker. Task status becomes 'idle', worker_id is cleared.
        Normally done by orchestrator, but admins can manually unassign.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id:
                  type: string
              required:
                - worker_id
      responses:
        '200':
          description: Task unassigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          description: Forbidden - admin/orchestrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/return:
    post:
      summary: Return task (worker only)
      description: |
        Worker returns a task, marking it as idle and clearing worker assignment.
        The task can then be reassigned. Current task and role on worker are cleared.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: task returned
        '403':
          description: Forbidden - worker access only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/complete:
    post:
      summary: Complete task
      description: Mark a task as complete (sets is_complete=true, completed_at timestamp, status=idle, worker_id=null)
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Cannot complete - dependencies not met or child tasks incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/history:
    get:
      summary: Get task history
      description: Get all history entries for a task, showing state changes and worker assignments
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistory'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{task_id}/comments:
    get:
      summary: Get task comments
      description: Get all comments on a task
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskComment'

    post:
      summary: Add task comment
      description: Add a comment to a task. Comment stores text, caller name, and timestamp.
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  minLength: 1
              required:
                - comment
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{task_id}/dependencies:
    get:
      summary: Get task dependencies
      description: Get all tasks that this task depends on and all tasks that depend on this task
      tags:
        - Tasks
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task dependencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  depends_on:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                    description: Tasks this task depends on
                  blocked_by:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                    description: Tasks that depend on this task

  /workers:
    get:
      summary: List workers
      description: List all workers (users of type 'worker')
      tags:
        - Workers
      responses:
        '200':
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /workers/{worker_id}:
    get:
      summary: Get worker
      description: Get a specific worker by ID
      tags:
        - Workers
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update worker
      description: Update worker details (admin only)
      tags:
        - Workers
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Worker updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /workers/{worker_id}/tasks:
    get:
      summary: Get worker tasks
      description: Get all tasks assigned to a worker
      tags:
        - Workers
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker's tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

  /workers/{worker_id}/history:
    get:
      summary: Get worker history
      description: Get task history for a worker - shows all work sessions
      tags:
        - Workers
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistory'

  /workers/{worker_id}/stats:
    get:
      summary: Get worker statistics
      description: Get statistics for a worker (total tasks, completion rate, etc)
      tags:
        - Workers
      parameters:
        - name: worker_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStats'

  /workers/heartbeat:
    post:
      summary: Worker heartbeat
      description: |
        Worker registers as alive and reports status. If worker doesn't heartbeat within
        configured `worker.idle` period, server marks worker as IDLE.
      tags:
        - Workers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Current worker status
                task_id:
                  type: string
                  nullable: true
                  description: Task being worked on (if any)
              required:
                - status
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: heartbeat received

  /orchestrator/heartbeat:
    post:
      summary: Orchestrator heartbeat
      description: |
        Orchestrator registers as alive. If orchestrator doesn't heartbeat within
        configured `orchestrator.idle` period, server marks orchestrator as IDLE.
      tags:
        - Orchestrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Current orchestrator status
              required:
                - status
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: heartbeat received

  /heartbeats:
    get:
      summary: List heartbeats
      description: List all worker and orchestrator heartbeats for monitoring
      tags:
        - Health
      responses:
        '200':
          description: List of heartbeats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Heartbeat'

  /config:
    get:
      summary: List all configuration
      description: Get all configuration key-value pairs (admin only)
      tags:
        - Config
      responses:
        '200':
          description: List of configuration items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigItem'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /config/{key}:
    get:
      summary: Get configuration value
      description: Get a specific configuration value by key (admin only)
      tags:
        - Config
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Configuration value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Configuration key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Set configuration value
      description: Set or update a configuration value (admin only)
      tags:
        - Config
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                description:
                  type: string
                  nullable: true
              required:
                - value
      responses:
        '200':
          description: Configuration set successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItem'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete configuration value
      description: Delete a configuration key (admin only)
      tags:
        - Config
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Configuration deleted successfully
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/passkey/register/begin:
    post:
      summary: Begin passkey registration
      description: Start WebAuthn passkey registration process
      tags:
        - Passkeys
      responses:
        '200':
          description: Registration challenge
          content:
            application/json:
              schema:
                type: object
                description: WebAuthn credential creation options

  /auth/passkey/register/finish:
    post:
      summary: Finish passkey registration
      description: Complete WebAuthn passkey registration
      tags:
        - Passkeys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: WebAuthn credential response
      responses:
        '200':
          description: Passkey registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/passkey/authenticate/begin:
    post:
      summary: Begin passkey authentication
      description: Start WebAuthn passkey authentication process
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
                - username
      responses:
        '200':
          description: Authentication challenge
          content:
            application/json:
              schema:
                type: object
                description: WebAuthn credential request options

  /auth/passkey/authenticate/finish:
    post:
      summary: Finish passkey authentication
      description: Complete WebAuthn passkey authentication and create session
      tags:
        - Passkeys
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: WebAuthn authentication response
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/passkey/list:
    get:
      summary: List user passkeys
      description: List all registered passkeys for the authenticated user
      tags:
        - Passkeys
      responses:
        '200':
          description: List of registered passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    device_name:
                      type: string
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    last_used_at:
                      type: string
                      format: date-time
                      nullable: true

  /auth/passkey:
    delete:
      summary: Delete passkey
      description: Delete a registered passkey
      tags:
        - Passkeys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_id:
                  type: string
              required:
                - credential_id
      responses:
        '204':
          description: Passkey deleted successfully
