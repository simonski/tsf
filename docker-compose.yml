version: '3.8'

services:
  initdb:
    build: .
    volumes:
      - ./data:/data
    environment:
      - TASK_DB_PATH=/data/task.db
    command: /app/task-initdb -f /data/task.db
    restart: "no"

  server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - TASK_DB_PATH=/data/task.db
    command: /app/task-server -f /data/task.db -port 8080
    depends_on:
      - initdb
    restart: unless-stopped

  orchestrator:
    build: .
    environment:
      - TASK_URL=http://server:8080
      - TASK_USERNAME=orchestrator
      - TASK_PASSWORD=${ORCHESTRATOR_PASSWORD}
    command: /app/task-orchestrator -url http://server:8080
    depends_on:
      - server
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
